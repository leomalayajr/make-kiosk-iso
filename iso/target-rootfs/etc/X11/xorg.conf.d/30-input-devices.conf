# =============================================================================
# 30-input-devices.conf - Input device configuration (keyboard + mouse)
#   - Keyboard: explicitly set for VMware PS/2 + USB keyboards
#   - Mouse: libinput handles all pointing devices
#   Works on bare metal, VMware, VirtualBox, Hyper-V
# =============================================================================

Section "InputClass"
    Identifier "vmware-keyboard"
    MatchProduct "VMware VMCI Bus|Virtual Keyboard|VMware PS/2"
    Driver "evdev"
    Option "XkbLayout" "us"
    Option "XkbModel" "pc105"
EndSection

Section "InputClass"
    Identifier "system-keyboard"
    MatchIsKeyboard "on"
    Driver "libinput"
    Option "XkbLayout" "us"
    Option "XkbModel" "pc105"
EndSection

Section "InputClass"
    Identifier "mouse-pointer"
    MatchIsPointer "on"
    Driver "libinput"
EndSection
