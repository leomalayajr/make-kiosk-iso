# The appliance UI has one supported display size. Keeping Xorg itself at this
# mode means fullscreen Electron windows cannot inherit an unexpected EDID or
# native monitor resolution.
Section "Monitor"
    Identifier "KioskFixedMonitor"
    Option "PreferredMode" "1024x768"
EndSection

Section "Screen"
    Identifier "KioskFixedScreen"
    Monitor "KioskFixedMonitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1024x768"
    EndSubSection
EndSection
